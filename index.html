<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClubQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ClubQ Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ClubQ palette: off-white surface, espresso display and buttons, charcoal body, taupe lines, camel as a trace. Single theme by brand. */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F1EEE9; --line:#D1CBC5;
  --ink:#3C2A1E; --ink-2:#544F50; --ink-3:#8B8485;
  --accent:#3C2A1E; --accent-ink:#FAF9F6; --accent-soft:#EEE7DF;
  --camel:#B07A4F;
  --warn:#7A6A5E; --warn-soft:#F1EEE9; --danger:#8F3B2E; --good:#3C2A1E;
  --shadow:0 1px 2px rgba(60,42,30,.06),0 4px 14px rgba(60,42,30,.06);
  --r:8px; --r-sm:5px;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink-2);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink)}
h1{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.005em}
h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.05}
h3{font-family:var(--body);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);min-height:100vh}
main{min-width:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .q{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:var(--ink)}
.brand .q b{font-weight:600}
.brand small{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{padding:16px;max-width:1080px;width:100%;margin:0 auto}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.on i{background:var(--camel)}
.sync.local i{background:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.item:hover{border-color:var(--ink-3)}
.item .t{font-weight:600;color:var(--ink)}
.item .s{color:var(--ink-3);font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.planned{background:var(--surface-2);color:var(--ink-2)}
.pill.done{background:var(--ink);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--camel);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;width:100%;min-width:0}
input[inputmode]{text-align:left;font-variant-numeric:tabular-nums}
label{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:block;margin-bottom:4px}
.field{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .grid2:has(> .field:nth-child(3)){grid-template-columns:1fr 1fr 1fr}
@media (max-width:560px){ .card .grid2:has(> .field:nth-child(3)){grid-template-columns:1fr} }
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r)}
.back{color:var(--ink-2);background:none;border:0;padding:0;font-weight:500;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.kpi{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 12px;align-items:baseline;font-size:14px}
.kpi .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.kpi .up{color:var(--camel)} .kpi .down{color:var(--danger)}
/* exercise block in session */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ex h4{margin:0 0 2px;font-size:16px;font-weight:600;font-family:var(--body);color:var(--ink)}
.ex .meta{color:var(--ink-3);font-size:13px}
.ex .rx{font-family:var(--body);font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px 8px;align-items:center;margin-top:10px}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.sets .n{color:var(--ink-3);font-weight:600;text-align:center}
.tick{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--ink-3)}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exrow{display:grid;grid-template-columns:1fr 64px 64px 84px 34px;gap:8px;align-items:end}
.exrow .name{font-weight:600;color:var(--ink);padding-bottom:9px;overflow-wrap:anywhere}
.exrow .name small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.picker{position:fixed;inset:0;background:rgba(60,42,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.picker .sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.picker .sheet header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-direction:column}
.picker .results{overflow:auto;padding:8px}
.picker .results button{color:var(--ink);display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:var(--r-sm)}
.picker .results button:hover{background:var(--surface-2)}
.picker .results .g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:10px 8px 2px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);z-index:30;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--camel);transition:width .2s}
footer.note{padding:10px 16px;text-align:center;color:var(--ink-3);font-size:12px}
@media (min-width:900px){
  main{padding:24px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .picker{align-items:center}
  .picker .sheet{border-radius:16px}
}
@media (max-width:560px){
  .grid3{grid-template-columns:1fr 1fr}
  .exrow{grid-template-columns:1fr 56px 56px 72px 30px}
  h1{font-size:30px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>
/* V1 additions */
.sets{grid-template-columns:34px 1fr 1fr 44px 44px 30px}
.sets input{padding:9px 6px}
.sets select.rpe{width:44px;height:40px;padding:0 4px;text-align:center;font-variant-numeric:tabular-nums;appearance:none;-webkit-appearance:none;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14px}
.sets select.rpe:not([value=""]){color:var(--ink)}
.sets .pb{display:block;font-size:10px;letter-spacing:.08em;color:var(--camel);font-weight:700}
.sets .noterow{grid-column:1 / -1}
.sets .noterow input{font-size:13px;padding:6px 8px}
.notebtn{width:32px;height:40px;border:0;background:transparent;color:var(--ink-3);font-size:16px;border-radius:var(--r-sm)}
.notebtn[aria-pressed="true"]{color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.rxg{display:grid;grid-template-columns:34px 1fr 1fr 1fr 34px;gap:6px 8px;align-items:center;margin-top:10px;max-width:560px}
.rxg select.unit{padding:2px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--ink-3);border:0;background:transparent;width:auto;appearance:auto}
.cpy{width:32px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);color:var(--ink-3);font-size:15px}
.cpy:hover{color:var(--ink);border-color:var(--ink-3)}
.rxg .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.rxg .n{color:var(--ink-3);font-weight:600;text-align:center}
.rxg input{padding:8px 8px}
.fields .field label{font-size:10px;letter-spacing:.08em;margin-bottom:3px}
.fields input{padding:7px 8px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);margin-right:6px;vertical-align:middle;font-variant-numeric:tabular-nums}
.hist{font-size:13px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.hist a{color:var(--ink-2);font-weight:500}
.week{display:grid;grid-template-columns:1fr;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:56px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--camel)}
.day.over{background:var(--accent-soft);border-color:var(--ink)}
.chip.dragging{opacity:.85;box-shadow:var(--shadow);position:relative;z-index:9}
.chip[data-drag]{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.day{-webkit-touch-callout:none}
.chip.missed{border-color:var(--danger);color:var(--danger)}
.chiprow{display:flex;gap:3px;align-items:stretch;position:relative}
.chiprow .chip{flex:1;min-width:0}
.chipcopy{border:0;background:transparent;border-radius:var(--r-sm);color:var(--ink-3);font-size:13px;padding:0 5px;display:inline-flex;align-items:center;cursor:pointer;line-height:1}
@media (hover:hover) and (min-width:900px){ .chiprow:not(.confirm) .chipcopy{position:absolute;top:1px;bottom:1px;opacity:0;transition:opacity .12s;background:var(--bg)} .chiprow:not(.confirm) .chipcopy:nth-of-type(2){right:22px} .chiprow:not(.confirm) .chipcopy:nth-of-type(3){right:2px} .chiprow:hover .chipcopy,.chiprow .chipcopy:focus-visible{opacity:1} .chiprow:not(.confirm) .chip.done ~ .chipcopy{background:var(--ink);color:var(--accent-ink)} }
.chipcopy:hover{color:var(--ink);border-color:var(--ink-3)}
.chipcopy.del{color:var(--accent-ink);background:var(--danger);font-size:12px;font-weight:600;padding:0 8px}
.day .dh span span{display:inline-flex;gap:2px}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.day .dh b{color:var(--ink);font-weight:600}
.day .dh button{border:0;background:transparent;color:var(--ink-3);font-size:16px;line-height:1;padding:0 2px}
.chip{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:7px 9px;font-size:13px;color:var(--ink)}
.chip.done{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.chip .n{color:inherit;opacity:.6;font-variant-numeric:tabular-nums}
.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating button{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-2)}
.rating button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{border-left:2px solid var(--line);padding-left:10px}
.stat .v{font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-top:2px}
.status{font-size:13px;padding:6px 8px;width:auto}
.vid{font-size:13px;padding:6px 8px;max-width:260px}
.clog{display:grid;grid-template-columns:repeat(3,1fr) 44px 44px;gap:8px;margin-top:10px;align-items:end}
.clog .field label{font-size:10px;letter-spacing:.08em;margin-bottom:3px}
.clog input,.clog select{padding:7px 8px;font-size:14px}
.clog select.rpe{width:44px;height:40px;padding:0 4px;text-align:center;appearance:none;-webkit-appearance:none;font-weight:600}
.fields select{padding:7px 8px;font-size:14px}
@media (max-width:560px){ .clog{grid-template-columns:1fr 1fr 1fr} .clog .field:has(.tick),.clog .field:has(.rpe){grid-column:auto} }
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chart{padding:12px 14px 8px}
.linkbtn{border:0;background:transparent;padding:0;font-weight:600;color:var(--ink);font-size:15px}
.linkbtn:hover{color:var(--camel)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--surface-2);font-variant-numeric:tabular-nums}
.tbl.five{min-width:640px}
.tbl.five td:first-child{white-space:nowrap;color:var(--ink);font-weight:500}
.dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:inline-block}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.checkin.complete{border-left:3px solid var(--ink)}
.checkin input.filled{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--ink);font-weight:600}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink-2)}
.wd:disabled{cursor:default;color:var(--ink-3);background:transparent}
.wd.today{border-color:var(--camel)}
.wd .dn{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-3)}
.wd .dd{font-size:16px;font-weight:600;color:var(--ink)}
.wd:disabled .dd{color:var(--ink-3);font-weight:500}
.dots1{display:flex;gap:3px;height:8px}
.dots1 i{width:8px;height:8px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.dots1 i.done{background:var(--ink)} .dots1 i.planned{background:transparent} .dots1 i.missed{border-color:var(--danger);background:var(--danger)} .dots1 i.none{border-color:transparent}
.hab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.hab[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
@media (max-width:560px){ .grid4{grid-template-columns:1fr 1fr} }
.ss{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ss .ssh{padding:6px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
.ss .ex{border:0;border-top:1px solid var(--line);border-radius:0}
.res{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px}
.rev{display:grid;grid-template-columns:34px 1fr 1fr 44px 1.2fr;gap:6px 10px;align-items:center;margin-top:10px;font-size:14px}
.rev .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.rev .n{color:var(--ink-3);font-weight:600;text-align:center}
.rev .ok{color:var(--ink);font-weight:600}
.rev .miss{color:var(--danger)}
@media (max-width:560px){ .rev{grid-template-columns:28px 1fr 1fr 36px 1fr;font-size:13px} }
.res .ok{color:var(--ink)} .res .miss{color:var(--danger)} .res i{color:var(--ink-3);font-style:normal}
@media (min-width:900px){ .week{grid-template-columns:repeat(7,1fr)} .day{min-height:120px} }
@media (max-width:560px){ .fields{grid-template-columns:repeat(3,1fr)} }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="q">Club<b>Q</b></span><small id="modeLabel">Coach</small></div>
    <div class="row">
      <span class="sync" id="sync"><i></i><span>Connecting</span></span>
      <div class="seg" role="group" aria-label="Mode" id="modeSeg">
        <button data-act="mode" data-v="coach" aria-pressed="true">Coach</button>
        <button data-act="mode" data-v="client" aria-pressed="false">Client</button>
      </div>
      <button class="btn ghost sm" data-act="signout" id="signoutBtn" hidden>Sign out</button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="note" id="foot"></footer>

<script>
(function(){

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtShort = s => { const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };

const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlb3ZrY2VncnNoamdjYm1na3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTQ4OTIsImV4cCI6MjEwMzkzMDg5Mn0.ZPxxiG4x_XXzQecnbrIRx-rQeF45PxQCFYhM_xUTLhM';

              fromRow: r => ({id:r.id, clientId:r.client_id, date:r.date, title:r.title, focus:r.focus||'', status:r.status, items:r.items||[], rating:r.rating, clientNote:r.client_note||'', coachComment:r.coach_comment||'', completedAt:r.completed_at, movedFrom:r.moved_from, movedByClient:r.moved_by_client}) },

const store = {
  sb:null, clients:{}, sessions:{}, exmeta:{}, metrics:{}, ready:false, mode:'connecting', listeners:[],
  onChange(fn){ this.listeners.push(fn); },
  emit(){ this.listeners.forEach(f=>f()); },
  async init(){
    if (LOCAL) { auth.ready=true; auth.session={local:true}; auth.email='local@clubq'; auth.coach={email:'local@clubq',name:'Coach',role:'admin'}; this.fallback(); return; }
    this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    const { data } = await this.sb.auth.getSession();
    auth.session = data.session; auth.ready=true;
    this.sb.auth.onAuthStateChange((ev, sess) => { const had=!!auth.session; auth.session=sess; if(sess && !had) this.afterLogin(); if(!sess && had){ auth.coach=null; auth.client=null; this.ready=false; render(); } });
    if (auth.session) await this.afterLogin(); else render();
  },
  async afterLogin(){
    if (this._loading) return; this._loading=true; try { await this._afterLogin(); } finally { this._loading=false; }
  },
  async _afterLogin(){
    auth.email = (auth.session.user.email||'').toLowerCase();
    const [co, cl] = await Promise.all([ this.sb.from('coaches').select('*'), this.sb.from('clients').select('*') ]);
    auth.coaches = co.data||[];
    auth.coach = auth.coaches.find(c=>c.email.toLowerCase()===auth.email) || null;
    if (!auth.coach) auth.client = (cl.data||[]).find(c=>(c.email||'').toLowerCase()===auth.email) || null;
    if (!auth.coach && !auth.client){ auth.error='No account is set up for '+auth.email+'. Ask your coach to add this address to your profile.'; this.ready=true; render(); return; }
    if (auth.coach){ state.mode = (localStorage.getItem('clubq-mode')||'coach'); state.page = state.mode==='coach' ? 'clients' : (state.clientSelf?'today':'pick'); }
    else { state.mode='client'; state.clientSelf=auth.client.id; state.page='today'; }
    this.mode='shared';
    const ingest = (col, rows) => { const o={}; (rows||[]).forEach(r=>{ const v=MAP[col].fromRow(r); o[v.id]=v; }); this[col]=o; };
    ingest('clients', cl.data);
    const since = addDays(today(), -120);
    const [se, me, ex, cc] = await Promise.all([
      this.sb.from('sessions').select('*').gte('date', addDays(today(), -365)),
      this.sb.from('metrics').select('*').gte('date', since),
      this.sb.from('exmeta').select('*'),
      auth.coach ? this.sb.from('coach_clients').select('*') : Promise.resolve({data:[]})
    ]);
    ingest('sessions', se.data); ingest('metrics', me.data); ingest('exmeta', ex.data); auth.assignments = cc.data||[];
    this.ready=true; this.emit();
    // live changes from other devices
    this.sb.channel('clubq').on('postgres_changes', {event:'*', schema:'public'}, p => {
      const col = p.table; if(!MAP[col]) return;
      if (p.eventType==='DELETE'){ const old=p.old||{}; const id = col==='metrics' ? (old.client_id+'__'+old.date) : col==='exmeta' ? old.slug : old.id; if(id) delete this[col][id]; }
      else { const v=MAP[col].fromRow(p.new); this[col][v.id]=v; }
      this.emit();
    }).subscribe();
  },
  async sendLink(email){
    email=(email||'').trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(email)){ toast('Enter your email address'); return; }
    const redirect = location.origin + location.pathname;
    const { error } = await this.sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirect, shouldCreateUser:true } });
    if (error){ auth.error = error.message; } else { auth.sent = email; auth.error=''; }

      return `<div class="row between"><h3>${cw===weekStart(t)?'This week':'Week of '+fmtShort(cw)}</h3><span class="row" style="gap:4px"><button class="btn ghost sm" data-act="cweek" data-v="-1" aria-label="Previous week">‹</button>${cw!==weekStart(t)?`<button class="btn ghost sm" data-act="cweekToday">Today</button>`:''}<button class="btn ghost sm" data-act="cweek" data-v="1" aria-label="Next week">›</button></span></div>
      <div class="week">${days.map((d,i)=>{ const ds=ss.filter(x=>x.date===d); return `<div class="day ${d===t?'today':''}" data-date="${d}"><div class="dh"><span><b>${DAYS[i]}</b> ${fmtShort(d)}</span></div>${ds.length?ds.map(x=>`<button class="chip ${st(x)==='done'?'done':''} ${st(x)==='missed'?'missed':''}" data-act="openSession" data-id="${x.id}" ${st(x)!=='done'?'data-drag="1"':''}><span>${st(x)==='done'?'✓ ':''}${esc(x.title||'Session')}</span></button>`).join(''):'<span class="muted small">Rest</span>'}</div>`; }).join('')}</div>
      `; })()}
    ${ms.length>1 ? `<h3>Bodyweight · 8 weeks</h3><div class="card chart">${lineChart(ms.map(x=>({date:x.date,v:x.weight})),{id:'cw',unit:'kg',dec:1,label:'Bodyweight'})}</div>`:''}
    ${metricsFor(me.id).length ? `<h3>Your weeks</h3>${weeklyTable(me.id, tg, 6)}`:''}
  </div>`;
}

function clientPick(){

  <div class="list">${cs.map(c=>`<button class="item" data-act="pickSelf" data-id="${c.id}"><span class="t">${esc(c.name)}</span><span class="muted">›</span></button>`).join('') || '<div class="empty">No clients set up yet. Switch to Coach and add one.</div>'}</div></div>`;
}
function clientSession(s){
  const items = s.items||[]; const total = items.reduce((n,it)=>n+(it.sets||0),0); const doneN = items.reduce((n,it)=>n+((it.done||[]).filter(x=>x&&x.ok).length),0);
  return `<button class="back" data-act="clientHome">‹ Home</button>
  <div class="stack">
    <div><div class="row between"><h1>${esc(s.title||'Session')}</h1><span class="pill ${s.status==='done'?'done':'planned'}">${s.status==='done'?'Done':fmtDate(s.date)}</span></div>
    ${s.focus?`<p style="margin:6px 0 0;color:var(--ink-2)">Focus: ${esc(s.focus)}</p>`:''}</div>
    ${s.coachComment ? `<div class="card"><label>From your coach</label>${esc(s.coachComment)}</div>` : ''}
    ${s.status!=='done' ? `<div class="row between"><span class="muted small">Can't make ${fmtDate(s.date)}?</span>${state.moving===s.id?`<span class="row" style="flex-wrap:nowrap"><input type="date" data-f="moveDate" value="${esc(s.date)}" style="width:auto;padding:6px 8px"><button class="btn sm primary" data-act="moveConfirm" data-id="${s.id}">Move</button><button class="btn ghost sm" data-act="moveCancel">Cancel</button></span>`:`<button class="btn ghost sm" data-act="moveStart" data-id="${s.id}">Move to another day</button>`}</div>` : ''}
    <div class="progress" aria-label="Sets completed"><i style="width:${total?Math.round(doneN/total*100):0}%"></i></div>
    <div class="muted small num">${doneN} of ${total} sets logged</div>
    ${runs(items).map(r=>{ const inner=r.idxs.map(i=>{ const it=items[i]; const h=exHistory(s.clientId,it.name,s.id); const bestBefore=h.best?e1rm(h.best.set):0; const v=meta(it.name).videoUrl; const lbl=itemLabel(items,i); return `<div class="ex">
      <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div>${lbl?`<span class="tag">${lbl}</span>`:''}<h4 style="display:inline">${esc(it.name)}</h4>${[it.note, rxMeta(it)].filter(Boolean).length?`<div class="meta">${[it.note, rxMeta(it)].filter(Boolean).map(esc).join(' · ')}</div>`:''}
        <div class="hist">${h.last?`Last ${h.last.cardio?esc(h.last.summary):h.last.sets.map(fmtSet).join(', ')}`:'First time'}${h.best?` · Best ${fmtSet(h.best.set)}`:''}${v?` · <a href="${esc(v)}" target="_blank" rel="noopener">Watch</a>`:''}${s.status!=='done'?` · <a href="#" data-act="swapPicker" data-i="${i}">Swap</a>`:''}</div></div><div class="rx num">${rx(it)}</div></div>
      ${isCardio(it) ? (()=>{ const d=(it.done||[])[0]||{}; const c=it.cardio||{}; const m=cmode(d.mode||c.mode); return `<div class="clog">
        <div class="field"><label>Type</label><select data-i="${i}" data-k="0" data-cf="mode">${CMODES.map(([v,l])=>`<option value="${v}" ${m===v?'selected':''}>${l}</option>`).join('')}</select></div>
        ${m==='interval' ? `<div class="field"><label>Work s</label><input type="text" inputmode="numeric" data-i="${i}" data-k="0" data-cf="workSec" value="${d.workSec??c.workSec??''}"></div><div class="field"><label>Rest s</label><input type="text" inputmode="numeric" data-i="${i}" data-k="0" data-cf="restSec" value="${d.restSec??c.restSec??''}"></div><div class="field"><label>Rounds</label><input type="text" inputmode="numeric" data-i="${i}" data-k="0" data-cf="rounds" value="${d.rounds??c.rounds??''}"></div>`
        : m==='distance' ? `<div class="field"><label>Distance</label><input data-i="${i}" data-k="0" data-cf="distance" value="${esc(d.distance||c.distance||'')}" placeholder="2000m"></div><div class="field"><label>Time</label><input inputmode="numeric" data-i="${i}" data-k="0" data-cf="time" value="${esc(d.time||'')}" placeholder="mm:ss"></div>`
        : m==='time' ? `<div class="field"><label>Minutes</label><input type="text" inputmode="numeric" data-i="${i}" data-k="0" data-cf="minutes" value="${d.minutes??c.minutes??''}"></div><div class="field"><label>Distance</label><input data-i="${i}" data-k="0" data-cf="distance" value="${esc(d.distance||'')}" placeholder="m or km"></div>`
        : `<div class="field"><label>Minutes</label><input type="text" inputmode="numeric" data-i="${i}" data-k="0" data-cf="minutes" value="${d.minutes??c.minutes??''}"></div>`}
        <div class="field"><label>RPE</label><select class="rpe" data-i="${i}" data-k="0" data-f="rpe" aria-label="RPE">${RPE_OPTS.map(v=>`<option value="${v}" ${String(d.rpe ?? it.rpe ?? '')===String(v)?'selected':''}>${rpeLabel(v)}</option>`).join('')}</select></div>
        <div class="field"><label>Done</label><button class="tick" data-act="tick" data-i="${i}" data-k="0" aria-pressed="${!!d.ok}" aria-label="Done">✓</button></div>
      </div>${it.addedByClient && s.status!=='done' ? `<div class="row" style="margin-top:8px;justify-content:flex-end">${state.confirmRm===i?`<button class="btn sm" data-act="rmCancel">Keep</button><button class="btn sm danger" data-act="rmClientItem" data-i="${i}">Remove</button>`:`<button class="btn ghost sm" data-act="rmAsk" data-i="${i}">Remove exercise</button>`}</div>`:''}`; })() : `<div class="sets"><span class="h">Set</span><span class="h">${UNITS.find(x=>x[0]===unitOf(it))[1]}</span><span class="h">${luOf(it)}</span><span class="h">RPE</span><span class="h">Done</span><span class="h"></span>
        ${Array.from({length:it.sets||0},(_,k)=>{ const d=(it.done||[])[k]||{}; const pb = d.ok && bestBefore>0 && e1rm({reps:d.reps??rxOf(it,k).reps,load:d.load??rxOf(it,k).load,lu:luOf(it)})>bestBefore; const open = state.openNotes[i+'-'+k] || d.note; return `<span class="n num">${k+1}${pb?'<span class="pb">PB</span>':''}</span>
          <input type="text" inputmode="numeric" data-i="${i}" data-k="${k}" data-f="reps" value="${d.reps ?? repsDefaultOf(rxOf(it,k)) ?? ''}" placeholder="${esc(rxOf(it,k).reps)}" aria-label="Set ${k+1} reps">
          <input type="text" inputmode="decimal" data-i="${i}" data-k="${k}" data-f="load" value="${d.load ?? rxOf(it,k).load ?? ''}" placeholder="${luOf(it)}" aria-label="Set ${k+1} load">
          <select class="rpe" data-i="${i}" data-k="${k}" data-f="rpe" aria-label="Set ${k+1} RPE">${RPE_OPTS.map(v=>`<option value="${v}" ${String(d.rpe ?? rxOf(it,k).rpe ?? '')===String(v)?'selected':''}>${rpeLabel(v)}</option>`).join('')}</select>
          <button class="tick" data-act="tick" data-i="${i}" data-k="${k}" aria-pressed="${!!d.ok}" aria-label="Set ${k+1} done">✓</button>
          <button class="notebtn" data-act="noteToggle" data-i="${i}" data-k="${k}" aria-pressed="${!!open}" aria-label="Note on set ${k+1}">✎</button>
          ${open?`<div class="noterow"><input data-i="${i}" data-k="${k}" data-f="note" value="${esc(d.note||'')}" placeholder="Note on this set"></div>`:''}`; }).join('')}
      </div>
      ${it.addedByClient && s.status!=='done' ? `<div class="row between" style="margin-top:8px"><span class="row"><button class="btn sm" data-act="setCount" data-i="${i}" data-v="1">+ Set</button><button class="btn ghost sm" data-act="setCount" data-i="${i}" data-v="-1" ${it.sets<=1?'disabled':''}>– Set</button></span>${state.confirmRm===i?`<span class="row"><button class="btn sm" data-act="rmCancel">Keep</button><button class="btn sm danger" data-act="rmClientItem" data-i="${i}">Remove</button></span>`:`<button class="btn ghost sm" data-act="rmAsk" data-i="${i}">Remove exercise</button>`}</div>`:''}`}
    </div>`; }).join(''); return r.idxs.length>1 ? `<div class="ss"><div class="ssh">Superset ${r.letter} · alternate ${r.idxs.map(i=>itemLabel(items,i)).join(' and ')}</div>${inner}</div>` : inner; }).join('')}
    ${s.status!=='done'?`<button class="btn" data-act="clientAddPicker" style="align-self:flex-start">+ Add an exercise you did today</button>`:''}
    <div class="card stack">
      <div class="field"><label>How hard was that, 1 to 10?</label><div class="rating">${Array.from({length:10},(_,k)=>`<button data-act="rate" data-v="${k+1}" aria-pressed="${s.rating===k+1}">${k+1}</button>`).join('')}</div></div>
      <div class="field"><label>How did it feel? (your coach reads this)</label><textarea data-f="clientNote" rows="2" placeholder="Energy, anything that felt off, anything worth knowing">${esc(s.clientNote||'')}</textarea></div>
    </div>
    <div class="row between">
      <span></span>
      ${s.status==='done' ? `<button class="btn" data-act="reopen">Reopen session</button>` : `<button class="btn primary" data-act="finish">Finish session</button>`}
    </div>
  </div>`;
}

/* ---------------- actions ---------------- */
function cloneItems(items, useLastLoad){ return normaliseGroups((items||[]).map(it=>{ const ts = useLastLoad ? topSet(it) : null; const base={name:it.name, group:it.group||'', unit:unitOf(it), loadUnit:luOf(it), sets:it.sets, reps:it.reps, load: ts ? ts.load : it.load, rpe:it.rpe??null, rest:it.rest??null, note:it.note||'', done:[]}; if(isCardio(it)) return Object.assign(base,{kind:'cardio', cardio:JSON.parse(JSON.stringify(it.cardio||{}))}); base.setsRx=Array.from({length:+it.sets||1},(_,k)=>{ const r=rxOf(it,k); const p=useLastLoad?(it.done||[])[k]:null; return {reps:r.reps, load: p&&p.ok&&p.load!=null&&p.load!=='' ? +p.load : r.load, rpe:r.rpe}; }); base.reps=base.setsRx[0].reps; base.load=base.setsRx[0].load; base.rpe=base.setsRx[0].rpe; return base; })); }
document.addEventListener('click', e => {
  if (Date.now()-suppressClick < 200) { e.preventDefault(); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'mode': if(!auth.coach) return; state.mode = el.dataset.v; try{localStorage.setItem('clubq-mode',state.mode);}catch(x){} state.page = state.mode==='coach' ? 'clients' : (state.clientSelf?'today':'pick'); state.draft=null; state.picker=null; render(); break;
    case 'back': go('clients',{clientId:null}); break;
    case 'library': go('library'); break;
    case 'libCat': state.libCat = el.dataset.v; render(); break;
    case 'toggleInactive': state.showInactive=!state.showInactive; render(); break;
    case 'addClient': state.adding=true; state.newName=''; state.newGoal=''; state.newEmail=''; render(); setTimeout(()=>{ const n=$('#newName'); if(n) n.focus(); },30); break;
    case 'cancelAdd': state.adding=false; render(); break;
    case 'createClient': { const name=(state.newName||'').trim(); if(!name){ toast('Give the client a name'); return; } const c={id:uid('c'),name,email:(state.newEmail||'').trim().toLowerCase(),goal:(state.newGoal||'').trim(),createdAt:today(),status:'active',targets:{},habits:[]}; state.adding=false; state.newEmail=''; store.put('clients',c); go('client',{clientId:c.id, weekOf:weekStart(today())}); break; }
    case 'openClient': state.chartSel={}; go('client',{clientId:id, weekOf:weekStart(today()), block:false, ctab:'programme'}); break;
    case 'askDel': state.confirmDel=id; render(); break;
    case 'cancelDel': state.confirmDel=null; render(); break;
    case 'deleteClient': { state.confirmDel=null; clientSessions(id).forEach(s=>store.remove('sessions',s.id)); metricsFor(id).forEach(m=>store.remove('metrics',m.id)); store.remove('clients',id); go('clients',{clientId:null}); break; }
    case 'week': state.weekOf = addDays(state.weekOf, 7*(+el.dataset.v)); render(); break;
    case 'weekToday': state.weekOf = weekStart(today()); render(); break;
    case 'copyWeek': { const c=store.clients[state.clientId]; const end=addDays(state.weekOf,6); const ws=clientSessions(c.id).filter(s=>s.date>=state.weekOf && s.date<=end); ws.forEach(s=>store.put('sessions',{id:uid('s'),clientId:c.id,date:addDays(s.date,7),title:s.title,focus:s.focus||'',status:'planned',items:cloneItems(s.items,true)})); state.weekOf=addDays(state.weekOf,7); toast(`Copied ${ws.length} session${ws.length===1?'':'s'} to next week. Loads set to last performed.`); render(); break; }
    case 'askBlock': state.block=true; state.blockWeeks=4; render(); break;
    case 'cancelBlock': state.block=false; render(); break;
    case 'buildBlock': { const n=Math.max(2,Math.min(12,+state.blockWeeks||4)); const c=store.clients[state.clientId]; const end=addDays(state.weekOf,6); const ws=clientSessions(c.id).filter(s=>s.date>=state.weekOf && s.date<=end); for(let w=1; w<n; w++) ws.forEach(s=>store.put('sessions',{id:uid('s'),clientId:c.id,date:addDays(s.date,7*w),title:s.title,focus:s.focus||'',status:'planned',items:cloneItems(s.items,false)})); state.block=false; toast(`Built a ${n}-week block from this week.`); render(); break; }
    case 'newSession': state.draft = {id:uid('s'), isNew:true, clientId:id, date:el.dataset.date||today(), title:'', focus:'', status:'planned', items:[], coachComment:''}; go('edit'); break;
    case 'copyLast': { const all=clientSessions(id); const last = all.find(s=>s.status==='done') || all[0]; if(!last) return; state.draft={id:uid('s'), isNew:true, clientId:id, date:today(), title:last.title, focus:last.focus||'', status:'planned', items:cloneItems(last.items,true), coachComment:''}; toast('Copied '+fmtDate(last.date)+'. Loads set to last performed.'); go('edit'); break; }
    case 'editSession': { const s=store.sessions[id]; state.draft=JSON.parse(JSON.stringify(s)); state.draft.isNew=false; state.reviewEdit=false; normaliseGroups(state.draft.items); go('edit'); break; }
    case 'reviewEdit': state.reviewEdit=true; render(); window.scrollTo(0,0); break;
    case 'saveComment': { const d=state.draft; const s=store.sessions[d.id]; if(s){ s.coachComment=d.coachComment||''; store.put('sessions',s); toast('Comment saved'); } break; }
    case 'cancelEdit': { const cid=state.draft.clientId; state.draft=null; go('client',{clientId:cid}); break; }
    case 'saveSession': { const d=state.draft; if(!d.title.trim()) d.title = 'Session'; if(!d.items.length){ toast('Add at least one exercise'); return; } const cid=d.clientId; const out=JSON.parse(JSON.stringify(d)); delete out.isNew; out.items.forEach(it=>{ if(isCardio(it)){ it.sets=1; const c=it.cardio||{}; ['minutes','workSec','restSec','rounds'].forEach(k=>{ c[k]=c[k]===''||c[k]==null?null:+c[k]; }); it.cardio=c; } if(!isCardio(it)){ ensureRx(it); it.setsRx.forEach(r=>{ r.reps=String(r.reps??'').trim()||'0'; }); } it.sets=+it.sets||1; it.reps=String(it.reps??'').trim()||'0'; it.load=numOrNull(it.load); it.rpe=rpeNorm(it.rpe); it.rest=it.rest===''||it.rest==null?null:+it.rest; it.done=(it.done||[]).slice(0,it.sets); }); normaliseGroups(out.items); store.put('sessions',out); state.draft=null; toast('Session saved'); go('client',{clientId:cid, weekOf:weekStart(out.date)}); break; }
    case 'askDelS': state.confirmDelS=true; render(); break;
    case 'cancelDelS': state.confirmDelS=false; render(); break;
    case 'deleteSession': { state.confirmDelS=false; const cid=state.draft.clientId; store.remove('sessions',state.draft.id); state.draft=null; go('client',{clientId:cid}); break; }
    case 'removeItem': state.draft.items.splice(+el.dataset.i,1); normaliseGroups(state.draft.items); render(); break;
    case 'superset': { const a=state.draft.items, i=+el.dataset.i; if(pairedWithPrev(a,i)){ a[i].group='_'; } else { a[i].group=a[i-1].group; } normaliseGroups(a); render(); break; }
    case 'moveItem': { const i=+el.dataset.i, j=i+(+el.dataset.v); const a=state.draft.items; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; a[i].group='_'; a[j].group='#'; normaliseGroups(a); render(); break; }
    case 'openPicker': state.picker={q:'',cat:''}; render(); setTimeout(()=>{ const q=$('#pickQ'); if(q) q.focus(); },30); break;
    case 'closePicker': if (el.classList.contains('picker') && e.target!==el) return; state.picker=null; render(); break;
    case 'pickCat': state.picker.cat=el.dataset.v; render(); setTimeout(()=>{ const q=$('#pickQ'); if(q) q.focus(); },30); break;
    case 'swapPicker': { e.preventDefault(); const s=store.sessions[state.sessionId]; state.picker={q:'',cat:'',target:'swap',swapIndex:+el.dataset.i,swapName:s.items[+el.dataset.i].name}; render(); break; }
    case 'clientAddPicker': state.picker={q:'',cat:'',target:'clientAdd'}; render(); setTimeout(()=>{ const q=$('#pickQ'); if(q) q.focus(); },30); break;
    case 'pick': { const name=el.dataset.name;
      if (state.picker.target==='swap'){ const s=store.sessions[state.sessionId]; const it=s.items[state.picker.swapIndex]; if(!it.swappedFrom) it.swappedFrom=it.name; const ni=newItem(name,null,false); it.name=name; it.load=0; it.done=[]; it.unit=ni.unit; if(ni.kind==='cardio'){ it.kind='cardio'; it.cardio=ni.cardio; it.sets=1; } else if(isCardio(it)){ delete it.kind; delete it.cardio; it.sets=3; it.reps=it.reps||'10'; } state.picker=null; store.put('sessions',s); toast('Swapped to '+name+'. Your coach will see this.'); break; }
      if (state.picker.target==='clientAdd'){ const s=store.sessions[state.sessionId]; s.items.push(newItem(name,null,true)); normaliseGroups(s.items); state.picker=null; store.put('sessions',s); toast('Added '+name); break; }
      const prev = state.draft.items[state.draft.items.length-1]; state.draft.items.push(newItem(name,prev,false)); normaliseGroups(state.draft.items); state.picker=null; render(); toast('Added '+name); break; }
    case 'rxSets': { const it=state.draft.items[+el.dataset.i]; ensureRx(it); const v=+el.dataset.v; if(v>0){ it.setsRx.push(Object.assign({},it.setsRx[it.setsRx.length-1])); } else if(it.setsRx.length>1) it.setsRx.pop(); it.sets=it.setsRx.length; render(); break; }
    case 'rxCopyAbove': { const it=state.draft.items[+el.dataset.i]; ensureRx(it); const k=+el.dataset.k; it.setsRx[k]=Object.assign({},it.setsRx[k-1]); render(); break; }
    case 'rxSame': { const it=state.draft.items[+el.dataset.i]; ensureRx(it); it.setsRx=it.setsRx.map(()=>Object.assign({},it.setsRx[0])); render(); break; }
    case 'ctab': state.ctab=el.dataset.v; render(); break;
    case 'sendLink': store.sendLink(state.loginEmail||$('#loginEmail').value); break;
    case 'loginAgain': auth.sent=false; auth.error=''; render(); break;
    case 'signout': store.signOut(); break;
    case 'assign': { const c=store.clients[state.clientId]; const on = !auth.assignments.some(a=>a.coach_email===el.dataset.v && a.client_id===c.id); store.setAssignment(el.dataset.v, c.id, on); break; }
    case 'copyWorkout': { const d=state.draft; const c=store.clients[d.clientId]; setClip({title:d.title, focus:d.focus||'', items:cloneItems(d.items,false), clientName:c?c.name:''}); toast('Copied. Open any client’s week and tap ⎘ on a day.'); render(); break; }
    case 'clearClip': setClip(null); render(); break;
    case 'askDelChip': e.stopPropagation(); state.confirmDelChip=id; render(); break;
    case 'cancelDelChip': e.stopPropagation(); state.confirmDelChip=null; render(); break;
    case 'deleteSessionNow': { e.stopPropagation(); state.confirmDelChip=null; const s=store.sessions[id]; store.remove('sessions',id); toast('Deleted '+(s?s.title||'session':'session')); break; }
    case 'copySession': { e.stopPropagation(); const s=store.sessions[id]; if(!s) return; const c=store.clients[s.clientId]; setClip({title:s.title, focus:s.focus||'', items:cloneItems(s.items,false), clientName:c?c.name:''}); toast('Copied “'+(s.title||'Session')+'”. Tap ⎘ on any day to paste.'); render(); break; }
    case 'paste': { if(!clipboard) return; const ns={id:uid('s'), clientId:id, date:el.dataset.date, title:clipboard.title||'Session', focus:clipboard.focus||'', status:'planned', items:cloneItems(clipboard.items,false), coachComment:''}; store.put('sessions',ns); toast(`Pasted “${ns.title}” on ${fmtDate(ns.date)}`); break; }
    case 'moveStart': state.moving=id; state.moveDate=null; render(); break;
    case 'moveCancel': state.moving=null; render(); break;
    case 'moveConfirm': { const s=store.sessions[id]; const nd=state.moveDate||s.date; if(nd!==s.date){ s.movedFrom=s.movedFrom||s.date; s.date=nd; s.movedByClient=true; store.put('sessions',s); toast('Moved to '+fmtDate(nd)); } state.moving=null; go('today',{sessionId:null}); break; }
    case 'chartModal': state.chartModal=el.dataset.v; render(); break;
    case 'closeModal': if (el.classList.contains('picker') && e.target!==el) return; state.chartModal=null; render(); break;
    case 'removeHabit': { const c=store.clients[state.clientId]; c.habits=(c.habits||[]).filter(h=>h.id!==id); store.put('clients',c); break; }
    case 'addHabit': { const c=store.clients[state.clientId]; const name=(state.habitName||'').trim(); if(!name){ toast('Name the habit'); return; } c.habits=(c.habits||[]).concat([{id:uid('h'),name,days:Math.max(1,Math.min(7,+state.habitDays||7))}]); state.habitName=''; state.habitDays=7; store.put('clients',c); break; }
    case 'cweek': state.cweek=addDays(state.cweek||weekStart(today()), 7*(+el.dataset.v)); render(); break;
    case 'cweekToday': state.cweek=weekStart(today()); render(); break;
    case 'checkDate': state.checkDate=addDays(state.checkDate||today(), +el.dataset.v); if(state.checkDate>today()) state.checkDate=today(); render(); break;
    case 'habitTick': { const m=mdoc(state.clientSelf, el.dataset.date); m.habits=Object.assign({},m.habits||{}); m.habits[id]=!m.habits[id]; store.put('metrics',m); break; }
    case 'openIntake': state.intakeDraft=null; go('intake'); break;
    case 'submitIntake': { const me=store.clients[state.clientSelf]; const a=state.intakeDraft||(me.intake?me.intake.answers:{}); if(!Object.values(a).some(v=>v&&v.trim())){ toast('Answer at least one question'); return; } me.intake={answers:a, completedAt:me.intake?me.intake.completedAt:today(), updatedAt:today()}; state.intakeDraft=null; store.put('clients',me); toast('Sent to your coach'); go('today'); break; }
    case 'rmAsk': state.confirmRm=+el.dataset.i; render(); break;
    case 'rmCancel': state.confirmRm=null; render(); break;
    case 'rmClientItem': { const s=store.sessions[state.sessionId]; const i=+el.dataset.i; if(!s.items[i]||!s.items[i].addedByClient) return; s.items.splice(i,1); normaliseGroups(s.items); state.confirmRm=null; store.put('sessions',s); toast('Removed'); break; }
    case 'setCount': { const s=store.sessions[state.sessionId]; const it=s.items[+el.dataset.i]; it.sets=Math.max(1,(+it.sets||1)+(+el.dataset.v)); it.done=(it.done||[]).slice(0,it.sets); store.put('sessions',s); break; }
    /* client */
    case 'pickSelf': state.clientSelf=id; try{localStorage.setItem('clubq-self',id);}catch(x){} go('today'); break;
    case 'switchSelf': if(!auth.coach) return; state.clientSelf=null; try{localStorage.removeItem('clubq-self');}catch(x){} go('pick'); break;
    case 'clientHome': go('today',{sessionId:null}); break;
    case 'openSession': state.openNotes={}; go('session',{sessionId:id}); break;
    case 'tick': { const s=store.sessions[state.sessionId]; const it=s.items[+el.dataset.i]; const k=+el.dataset.k; it.done=it.done||[]; const d=it.done[k]||{reps:it.reps,load:it.load}; d.ok=!d.ok; if(d.ok){ if(isCardio(it)){ const c=it.cardio||{}; if(!d.mode) d.mode=cmode(c.mode); if((d.mode==='steady'||d.mode==='time') && d.minutes==null && c.minutes) d.minutes=c.minutes; if(d.mode==='distance' && !d.distance && c.distance) d.distance=c.distance; if(d.mode==='interval'){ if(d.workSec==null) d.workSec=c.workSec; if(d.restSec==null) d.restSec=c.restSec; if(d.rounds==null) d.rounds=c.rounds; } } else { const r0=rxOf(it,k); if(d.reps==null){ const r=repsDefaultOf(r0); if(r!=null) d.reps=r; } if(d.load==null && r0.load!=null) d.load=r0.load; if(d.rpe==null && r0.rpe) d.rpe=r0.rpe; } if(d.rpe==null && it.rpe) d.rpe=it.rpe; } it.done[k]=d; store.put('sessions',s); break; }
    case 'noteToggle': { const key=el.dataset.i+'-'+el.dataset.k; state.openNotes[key]=!state.openNotes[key]; render(); if(state.openNotes[key]){ const n=document.querySelector(`input[data-f="note"][data-i="${el.dataset.i}"][data-k="${el.dataset.k}"]`); if(n) n.focus(); } break; }
    case 'rate': { const s=store.sessions[state.sessionId]; s.rating = s.rating===+el.dataset.v ? null : +el.dataset.v; store.put('sessions',s); break; }
    case 'finish': { const s=store.sessions[state.sessionId]; s.status='done'; s.completedAt=new Date().toISOString(); store.put('sessions',s); toast('Session logged.'); go('today',{sessionId:null}); break; }
    case 'reopen': { const s=store.sessions[state.sessionId]; s.status='planned'; store.put('sessions',s); break; }
  }
});
let saveTimer=null, metaTimer=null, metricTimer=null;
document.addEventListener('input', e => {
  const el=e.target; const f=el.dataset.f||el.dataset.cf; if(!f || el.tagName==='SELECT') return;
  if (f==='libQ'){ state.libQ=el.value; const r=$('#libResults'); if(r) r.innerHTML=libResults(); return; }
  if (f==='newName'){ state.newName=el.value; return; }
  if (f==='newGoal'){ state.newGoal=el.value; return; }
  if (f==='blockWeeks'){ state.blockWeeks=el.value; return; }
  if (f==='loginEmail'){ state.loginEmail=el.value; return; }
  if (f==='newEmail'){ state.newEmail=el.value; return; }
  if (f==='moveDate'){ state.moveDate=el.value; return; }
  if (f==='habitName'){ state.habitName=el.value; return; }
  if (f==='habitDays'){ state.habitDays=el.value; return; }
  if (f==='intake'){ const me=store.clients[state.clientSelf]; state.intakeDraft=state.intakeDraft||Object.assign({}, me&&me.intake?me.intake.answers:{}); state.intakeDraft[el.dataset.k]=el.value; return; }
  if (f==='metric'){ const cid=state.clientSelf, date=el.dataset.date, k=el.dataset.k, v= k==='notes' ? el.value : (el.value===''?null:+el.value); if(k!=='notes') el.classList.toggle('filled', el.value!==''); clearTimeout(metricTimer); metricTimer=setTimeout(()=>{ const m=mdoc(cid,date); m[k]=v; store.put('metrics',m); },500); return; }
  if (f==='cintake'){ const k=el.dataset.k, v=el.value; clearTimeout(metaTimer); metaTimer=setTimeout(()=>{ const c=store.clients[state.clientId]; if(!c) return; c.intake=c.intake||{answers:{}, completedAt:today()}; c.intake.answers=Object.assign({},c.intake.answers||{}); c.intake.answers[k]=v; c.intake.updatedAt=today(); c.intake.filledBy='coach'; store.put('clients',c); },600); return; }
  if (f==='clientGoal' || f==='clientEmail' || f==='target'){ clearTimeout(metaTimer); metaTimer=setTimeout(()=>{ const c=store.clients[state.clientId]; if(!c) return; if(f==='clientGoal') c.goal=el.value.trim(); else if(f==='clientEmail') c.email=el.value.trim().toLowerCase(); else { c.targets=Object.assign({},c.targets||{}); c.targets[el.dataset.k]=el.value===''?null:+el.value; } store.put('clients',c); },500); return; }
  if (f==='pickQ'){ state.picker.q=el.value; const r=$('#pickResults'); if(r) r.innerHTML=pickerResults(); return; }
  if (f==='video'){ const name=el.dataset.name; clearTimeout(metaTimer); metaTimer=setTimeout(()=>{ const m=Object.assign({}, meta(name), {id:slug(name), name, videoUrl:el.value.trim()}); store.put('exmeta', m); },500); return; }
  if (state.mode==='coach' && state.draft){
    if (el.dataset.cf!=null){ const it=state.draft.items[+el.dataset.i]; it.cardio=it.cardio||{}; it.cardio[el.dataset.cf]=el.value; return; }
    if (el.dataset.i!=null && el.dataset.k!=null){ const it=state.draft.items[+el.dataset.i]; ensureRx(it); const r=it.setsRx[+el.dataset.k]; r[f] = f==='reps' ? el.value : numOrNull(el.value); it.reps=it.setsRx[0].reps; it.load=it.setsRx[0].load; it.rpe=it.setsRx[0].rpe; }
    else if (el.dataset.i!=null){ const it=state.draft.items[+el.dataset.i]; it[f]=el.value; }
    else state.draft[f]=el.value;
    return;
  }
  if (state.mode==='client' && state.sessionId){
    const s=store.sessions[state.sessionId]; if(!s) return;
    if (f==='clientNote') s.clientNote=el.value;
    else if (el.dataset.cf!=null){ const it=s.items[+el.dataset.i]; it.done=it.done||[]; const d=it.done[0]||{mode:(it.cardio||{}).mode||'steady',ok:false}; const cf=el.dataset.cf; d[cf] = ['distance','note','pace','perRound','time'].includes(cf) ? el.value : (el.value===''?null:+el.value); it.done[0]=d; }
    else if (el.dataset.i!=null){ const it=s.items[+el.dataset.i]; const k=+el.dataset.k; it.done=it.done||[]; const d=it.done[k]||{reps:it.reps,load:it.load,ok:false}; d[f] = f==='note' ? el.value : numOrNull(el.value); it.done[k]=d; }
    clearTimeout(saveTimer); const sid=state.sessionId; saveTimer=setTimeout(()=>{ const live=store.sessions[sid]; if(live) store.put('sessions',live); },600);
  }
});
document.addEventListener('click', e => {
  const svg = e.target.closest && e.target.closest('svg[data-chart]'); if(!svg) return;
  const xs = svg.dataset.xs.split(',').map(Number); if(!xs.length) return;
  const r = svg.getBoundingClientRect(); const sc = Math.min(r.width/320, r.height/132); const ox = (r.width - 320*sc)/2; const vx = (e.clientX - r.left - ox)/sc;
  let best=0; xs.forEach((x,i)=>{ if(Math.abs(x-vx) < Math.abs(xs[best]-vx)) best=i; });
  state.chartSel = state.chartSel||{}; state.chartSel[svg.dataset.chart] = state.chartSel[svg.dataset.chart]===best ? null : best;
  renderKeepFocus();
});
/* pointer-based drag of a workout chip onto another day (works with mouse and touch) */
let drag=null, suppressClick=0;
function dragStart(chip, x, y){ drag={id:chip.dataset.id, x, y, chip, active:false, over:null}; }
function dragMove(x, y, ev){ if(!drag) return; const dx=x-drag.x, dy=y-drag.y; if(!drag.active){ if(Math.hypot(dx,dy)<8) return; drag.active=true; drag.chip.classList.add('dragging'); drag.timer=setInterval(()=>{ if(!drag) return; const h=window.innerHeight; if(drag.ly>h-70) window.scrollBy(0,10); else if(drag.ly<70) window.scrollBy(0,-10); },16); } drag.ly=y; if(ev && ev.cancelable) ev.preventDefault(); drag.chip.style.transform=`translate(${dx}px,${dy}px)`; const day=[...document.querySelectorAll('.day[data-date]')].find(d=>{ const r=d.getBoundingClientRect(); return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; }); if(day!==drag.over){ document.querySelectorAll('.day.over').forEach(x=>x.classList.remove('over')); if(day) day.classList.add('over'); drag.over=day; } }
document.addEventListener('pointerdown', e => { if(e.pointerType==='touch') return; const chip=e.target.closest && e.target.closest('.chip[data-drag]'); if(!chip || e.button) return; dragStart(chip, e.clientX, e.clientY); try{ chip.setPointerCapture(e.pointerId); }catch(x){} });
document.addEventListener('touchstart', e => { const chip=e.target.closest && e.target.closest('.chip[data-drag]'); if(!chip || e.touches.length!==1) return; const t=e.touches[0]; dragStart(chip, t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchmove', e => { if(!drag) return; const t=e.touches[0]; dragMove(t.clientX, t.clientY, e); }, {passive:false});
document.addEventListener('touchend', e => { if(!drag) return; if(drag.active){ e.preventDefault(); } endDrag(e); }, {passive:false});
document.addEventListener('touchcancel', endDrag);
document.addEventListener('pointermove', e => { if(!drag || e.pointerType==='touch') return; dragMove(e.clientX, e.clientY, e); });
function endDrag(e){ if(!drag) return; const d=drag; drag=null; clearInterval(d.timer); d.chip.classList.remove('dragging'); d.chip.style.transform=''; document.querySelectorAll('.day.over').forEach(x=>x.classList.remove('over')); if(!d.active) return; suppressClick=Date.now(); const s=store.sessions[d.id]; if(d.over && s && s.date!==d.over.dataset.date){ if(state.mode==='client'){ s.movedFrom=s.movedFrom||s.date; s.movedByClient=true; } s.date=d.over.dataset.date; store.put('sessions',s); toast('Moved to '+fmtDate(s.date)); } else render(); }
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='loginEmail'){ e.preventDefault(); store.sendLink(e.target.value); } });
let lastPointer=0; document.addEventListener('pointerdown', ()=>{ lastPointer=Date.now(); }, true);
document.addEventListener('focusin', e => { const el=e.target; if(el.tagName==='INPUT' && el.getAttribute('inputmode') && el.value!=='' && Date.now()-lastPointer<600){ const sel=()=>{ try{ el.select(); }catch(x){} }; sel(); setTimeout(sel,0); } });
document.addEventListener('pointerup', e => { if(e.pointerType==='touch') return; endDrag(e); }); document.addEventListener('pointercancel', e => { if(e.pointerType==='touch') return; endDrag(e); });
document.addEventListener('change', e => {
  const el=e.target;
  if(el.dataset.f==='rpe' && el.tagName==='SELECT' && state.mode==='coach' && state.draft && el.dataset.k!=null){ const it=state.draft.items[+el.dataset.i]; ensureRx(it); it.setsRx[+el.dataset.k].rpe=rpeNorm(el.value); it.rpe=it.setsRx[0].rpe; return; }
  if(el.dataset.f==='loadUnit' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.loadUnit=el.value; render(); return; }
  if(el.dataset.f==='rest' && el.tagName==='SELECT' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.rest=el.value===''?null:+el.value; return; }
  if(el.dataset.f==='unit' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.unit=el.value; render(); return; }
  if(el.dataset.cf==='mode'){ if(state.mode==='coach' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.cardio=it.cardio||{}; it.cardio.mode=el.value; render(); } else if(state.mode==='client' && state.sessionId){ const s=store.sessions[state.sessionId]; const it=s.items[+el.dataset.i]; it.done=it.done||[]; const d=it.done[0]||{ok:false}; d.mode=el.value; it.done[0]=d; store.put('sessions',s); } return; }
  if(el.dataset.f==='rpe' && el.tagName==='SELECT' && state.mode==='client' && state.sessionId){ const s=store.sessions[state.sessionId]; const it=s.items[+el.dataset.i]; const k=+el.dataset.k; it.done=it.done||[]; const d=it.done[k]||{reps:repsDefault(it),load:it.load,ok:false}; d.rpe = rpeNorm(el.value); it.done[k]=d; store.put('sessions',s); return; }
  if(el.dataset.f==='clientStatus'){ const c=store.clients[state.clientId]; c.status=el.value; store.put('clients',c); toast(el.value==='active'?'Client active':el.value==='paused'?'Client paused':'Client archived'); }
});
function rerenderKeepFocus(el){ const id=el.id, pos=el.selectionStart; render(); const n = id ? document.getElementById(id) : document.querySelector('[data-f="'+el.dataset.f+'"]'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } }

let pendingRender=false;
function typing(){ const a=document.activeElement; return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA') && a.type!=='date'; }
store.onChange(()=>{ if (state.mode==='coach' && (state.page==='edit' || state.page==='library')) { const sy=$('#sync'); sy.className='sync '+(store.mode==='shared'?'on':'local'); return; } if (typing()) { pendingRender=true; return; } render(); });
document.addEventListener('focusout', ()=>{ if(pendingRender){ pendingRender=false; setTimeout(()=>{ if(!typing()) render(); else pendingRender=true; }, 60); } });
function renderKeepFocus(){ const a=document.activeElement; const isField = a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA') && a.dataset.f; const key = isField ? {f:a.dataset.f,i:a.dataset.i,k:a.dataset.k,pos:a.selectionStart,val:a.value} : null; render(); if(key){ const sel='[data-f="'+key.f+'"]'+(key.i!=null?'[data-i="'+key.i+'"]':'')+(key.k!=null?'[data-k="'+key.k+'"]':''); const n=document.querySelector(sel); if(n){ if(n.value!==key.val) n.value=key.val; n.focus(); try{n.setSelectionRange(key.pos,key.pos);}catch(x){} } } }
render();
store.init();
})();
