<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClubQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ClubQ Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ClubQ palette: off-white surface, espresso display and buttons, charcoal body, taupe lines, camel as a trace. Single theme by brand. */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F1EEE9; --line:#D1CBC5;
  --ink:#3C2A1E; --ink-2:#544F50; --ink-3:#8B8485;
  --accent:#3C2A1E; --accent-ink:#FAF9F6; --accent-soft:#EEE7DF;
  --camel:#B07A4F;
  --warn:#7A6A5E; --warn-soft:#F1EEE9; --danger:#8F3B2E; --good:#3C2A1E;
  --shadow:0 1px 2px rgba(60,42,30,.06),0 4px 14px rgba(60,42,30,.06);
  --r:8px; --r-sm:5px;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink-2);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink)}
h1{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.005em}
h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.05}
h3{font-family:var(--body);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);min-height:100vh}
main{min-width:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .q{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:var(--ink)}
.brand .q b{font-weight:600}
.brand small{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{padding:16px;max-width:1080px;width:100%;margin:0 auto}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.on i{background:var(--camel)}
.sync.local i{background:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.item:hover{border-color:var(--ink-3)}
.item .t{font-weight:600;color:var(--ink)}
.item .s{color:var(--ink-3);font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.planned{background:var(--surface-2);color:var(--ink-2)}
.pill.done{background:var(--ink);color:var(--accent-ink)}
[hidden]{display:none!important}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--camel);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;width:100%;min-width:0}
textarea.grow{resize:none;overflow:hidden;line-height:1.35;display:block}
input[inputmode]{text-align:left;font-variant-numeric:tabular-nums}
label{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:block;margin-bottom:4px}
.field{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card .grid2:has(> .field:nth-child(3)){grid-template-columns:1fr 1fr 1fr}
@media (max-width:560px){ .card .grid2:has(> .field:nth-child(3)){grid-template-columns:1fr} }
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r)}
.back{color:var(--ink-2);background:none;border:0;padding:0;font-weight:500;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.kpi{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 12px;align-items:baseline;font-size:14px}
.kpi .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.kpi .up{color:var(--camel)} .kpi .down{color:var(--danger)}
.tg-on{color:#3F7A4C} .tg-near{color:#B07A1F} .tg-off{color:var(--danger)} .tbl td.tg-on, .tbl td.tg-near, .tbl td.tg-off{font-weight:600}
.kpihist{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:6px 10px 8px;border-left:2px solid var(--line);margin:0 0 4px}
/* exercise block in session */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ex h4{margin:0 0 2px;font-size:16px;font-weight:600;font-family:var(--body);color:var(--ink)}
.ex .meta{color:var(--ink-3);font-size:13px}
.ex .rx{font-family:var(--body);font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;text-align:right}
@media (max-width:480px){ .ex .rx{font-size:15px;white-space:normal;max-width:55%} }
.sets{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px 8px;align-items:center;margin-top:10px}
select.warm{width:auto;font-size:12px;padding:3px 24px 3px 8px;min-height:0;height:26px;color:var(--ink-2)}
.warmup{margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r-sm)}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.sets .n{color:var(--ink-3);font-weight:600;text-align:center}
.tick{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--ink-3)}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exrow{display:grid;grid-template-columns:1fr 64px 64px 84px 34px;gap:8px;align-items:end}
.exrow .name{font-weight:600;color:var(--ink);padding-bottom:9px;overflow-wrap:anywhere}
.exrow .name small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.picker{position:fixed;inset:0;background:rgba(60,42,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.picker .sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.picker .sheet header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-direction:column}
.picker .results{overflow:auto;padding:8px}
.picker .results button{color:var(--ink);display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:var(--r-sm)}
.picker .results button:hover{background:var(--surface-2)}
.picker .results .g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:10px 8px 2px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);z-index:30;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--camel);transition:width .2s}
footer.note{padding:10px 16px;text-align:center;color:var(--ink-3);font-size:12px}
@media (min-width:900px){
  main{padding:24px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .picker{align-items:center}
  .picker .sheet{border-radius:16px}
}
@media (max-width:560px){
  .grid3{grid-template-columns:1fr 1fr}
  .exrow{grid-template-columns:1fr 56px 56px 72px 30px}
  h1{font-size:30px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>
/* V1 additions */
.sets{grid-template-columns:34px 1fr 1fr 44px 44px 30px}
.sets input{padding:9px 6px}
.sets select.rpe{width:44px;height:40px;padding:0 4px;text-align:center;font-variant-numeric:tabular-nums;appearance:none;-webkit-appearance:none;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14px}
.sets select.rpe:not([value=""]){color:var(--ink)}
.sets .pb{display:block;font-size:10px;letter-spacing:.08em;color:var(--camel);font-weight:700}

.sets .noterow input{font-size:13px;padding:6px 8px}

.fields{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}

.cpy{width:32px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);color:var(--ink-3);font-size:15px}

.rxg .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}

.hist{font-size:12px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 5px;align-items:center}
.hist .hl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--ink-3);margin-right:1px}
.hist .hl+.hl, .hist .hs+.hl{margin-left:6px}
.hist .hs{padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2)}
.hist .hs.best{border-color:var(--camel);color:var(--camel)}
.hist .hlinks{margin-left:6px;font-size:13px}
.hist .hg{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.restline{margin-top:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.hist .hs+.hg{margin-left:6px}
.rx .wu{display:inline-block;color:var(--ink-3);font-weight:500} .rx .wm{display:inline-block;white-space:nowrap}
.hist a{color:var(--ink-2);font-weight:500}
.week{display:grid;grid-template-columns:1fr;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:56px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--camel)}
.day.over{background:var(--accent-soft);border-color:var(--ink)}
.chip.dragging{opacity:.85;box-shadow:var(--shadow);position:relative;z-index:9}
.chip[data-drag]{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.day{-webkit-touch-callout:none}
.chip.missed{border-color:var(--danger);color:var(--danger)}
.chiprow{display:flex;gap:3px;align-items:stretch;position:relative}
.chiprow .chip{flex:1;min-width:0}
.chipcopy{border:0;background:transparent;border-radius:var(--r-sm);color:var(--ink-3);font-size:13px;padding:0 5px;display:inline-flex;align-items:center;cursor:pointer;line-height:1}
@media (hover:hover) and (min-width:900px){ .chiprow:not(.confirm) .chipcopy{position:absolute;top:1px;bottom:1px;opacity:0;transition:opacity .12s;background:var(--bg)} .chiprow:not(.confirm) .chipcopy:nth-of-type(2){right:22px} .chiprow:not(.confirm) .chipcopy:nth-of-type(3){right:2px} .chiprow:hover .chipcopy,.chiprow .chipcopy:focus-visible{opacity:1} .chiprow:not(.confirm) .chip.done ~ .chipcopy{background:var(--ink);color:var(--accent-ink)} }
.chipcopy:hover{color:var(--ink);border-color:var(--ink-3)}
.chipcopy.del{color:var(--accent-ink);background:var(--danger);font-size:12px;font-weight:600;padding:0 8px}
.day .dh span span{display:inline-flex;gap:2px}

.chip .n{color:inherit;opacity:.6;font-variant-numeric:tabular-nums}
.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating button{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-2)}
.rating button[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{border-left:2px solid var(--line);padding-left:10px}

.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-top:2px}
.status{font-size:13px;padding:6px 8px;width:auto}
.vid{font-size:13px;padding:6px 8px;max-width:260px}
.clog{display:grid;grid-template-columns:repeat(3,1fr) 44px 44px;gap:8px;margin-top:10px;align-items:end}
.clog .field label{font-size:10px;letter-spacing:.08em;margin-bottom:3px}
.clog input,.clog select{padding:7px 8px;font-size:14px}
.clog select.rpe{width:44px;height:40px;padding:0 4px;text-align:center;appearance:none;-webkit-appearance:none;font-weight:600}
.fields select{padding:7px 8px;font-size:14px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}

.chart{padding:12px 14px 8px}
.linkbtn{border:0;background:transparent;padding:0;font-weight:600;color:var(--ink);font-size:15px}

.subblock.over{background:var(--accent-soft);outline:2px solid var(--ink)}
.exrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:var(--r-sm);color:var(--ink);font-size:15px}
.exrow>span:first-child:not(.grip),.exrow .exname{flex:1;min-width:0}
.exrow .grip{flex:none}
.exrow.edit{gap:8px;padding:6px 8px;flex-wrap:wrap}
.exrow .exi{padding:6px 8px;font-size:14px;width:auto}
.exrow .exi.name{flex:1;min-width:180px;font-weight:500;color:var(--ink)}
.exrow .exi.vid{width:150px;font-size:12px;color:var(--ink-2)}
.exrow select.exi{width:auto}
.exrow .exflags{display:inline-flex;gap:4px;justify-content:flex-end;min-width:72px}
.dd{position:relative}
.dd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;background:var(--surface);cursor:pointer;color:var(--ink)}
.dd summary::-webkit-details-marker{display:none}
.dd summary i{color:var(--ink-3);font-style:normal}
.dd[open] summary{border-color:var(--ink-3)}
.ddlist{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:6px}
.ddlist label{display:flex;gap:8px;align-items:center;padding:6px 8px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400;margin:0;border-radius:4px}
.ddlist label:hover{background:var(--surface-2)}
.picker .results button.exrow.pick,.exrow.pick,.exrow.pickhead{display:grid;grid-template-columns:minmax(0,1.4fr) 44px minmax(0,1.2fr) minmax(0,1fr);gap:10px;align-items:center}
.exrow.pick .ps,.exrow.pickhead .ps{text-align:center;font-weight:600;color:var(--ink)}
.exrow.pick .pm{color:var(--ink-2)}
.exrow.pickhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:6px 8px 0;border-top:1px solid var(--line);margin-top:4px}
.exrow.pickhead .ps{color:var(--ink-3)}
.picker .filters select.lf{padding:5px 8px;font-size:12px}

.vidwrap{position:relative;background:#000;aspect-ratio:16/9;width:100%}
.vidwrap iframe,.vidwrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidwrap .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);border:0}
.ddgroup{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-3);padding:10px 8px 2px}
.ddgroup:first-child{padding-top:4px}
.ddlist input{width:auto;margin:0}
@media (max-width:560px){ .exrow .exi.vid{width:100%} }
.exrow .exname{border:0;background:transparent;text-align:left;color:var(--ink);font-size:15px;padding:0;font-weight:500}
.exrow .exname:hover{color:var(--camel)}
button.exrow:hover{background:var(--surface-2)}
.exrow.edit{border:1px solid var(--line);background:var(--surface);margin:4px 0;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.exrow .grip{color:var(--ink-3);letter-spacing:-2px;cursor:grab;touch-action:none;padding:0 2px}
.exrow.dragging{opacity:.85;box-shadow:var(--shadow);position:relative;z-index:9}
.na{color:var(--danger);font-style:normal}
.libwrap{padding:0 4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select.lf{width:auto;padding:7px 10px;font-size:13px}
.hab.sm{padding:5px 10px;font-size:12px}
.catgrid{display:grid;grid-template-columns:1fr;gap:6px}
.ss{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ss .ssh{padding:6px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
.ss .ex{border:0;border-top:1px solid var(--line);border-radius:0}
.res{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px}
.rev{display:grid;grid-template-columns:34px 1fr 1fr 44px 1.2fr;gap:6px 10px;align-items:center;margin-top:10px;font-size:14px}
.rev .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.rev .n{color:var(--ink-3);font-weight:600;text-align:center}
.rev .ok{color:var(--ink);font-weight:600}
.rev .miss{color:var(--danger)}
@media (max-width:560px){ .rev{grid-template-columns:28px 1fr 1fr 36px 1fr;font-size:13px} }
.res .ok{color:var(--ink)} .res .miss{color:var(--danger)} .res i{color:var(--ink-3);font-style:normal}
@media (min-width:900px){ .week{grid-template-columns:repeat(7,1fr)} .day{min-height:120px} }
@media (max-width:560px){ .fields{grid-template-columns:repeat(3,1fr)} }
</style>

const fmtShort = s => { const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };

const auth = { ready:false, session:null, email:'', coach:null, client:null, coaches:[], assignments:[], sent:false, error:'' };

const store = {
  sb:null, clients:{}, sessions:{}, exmeta:{}, metrics:{}, exercises:{}, ready:false, mode:'connecting', listeners:[],

  async init(){

  async afterLogin(){

function cloneItems(items, useLastLoad){ return normaliseGroups((items||[]).map(it=>{ const ts = useLastLoad ? topSet(it) : null; const base={name:exName(it), exerciseId:it.exerciseId||undefined, group:it.group||'', unit:unitOf(it), loadUnit:luOf(it), sets:it.sets, reps:it.reps, load: ts ? ts.load : it.load, rpe:it.rpe??null, rest:it.rest??null, warmup:+it.warmup||0, note:it.note||'', done:[]}; if(isCardio(it)) return Object.assign(base,{kind:'cardio', cardio:JSON.parse(JSON.stringify(it.cardio||{}))}); base.setsRx=Array.from({length:+it.sets||1},(_,k)=>{ const r=rxOf(it,k); const p=useLastLoad?(it.done||[])[k]:null; return {reps:r.reps, load: p&&p.ok&&p.load!=null&&p.load!=='' ? +p.load : r.load, rpe:r.rpe}; }); base.reps=base.setsRx[0].reps; base.load=base.setsRx[0].load; base.rpe=base.setsRx[0].rpe; return base; })); }
document.addEventListener('click', e => {
  if (Date.now()-suppressClick < 200) { e.preventDefault(); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'mode': if(!auth.coach) return; state.mode = el.dataset.v; try{localStorage.setItem('clubq-mode',state.mode);}catch(x){} state.page = state.mode==='coach' ? 'clients' : (state.clientSelf?'today':'pick'); state.draft=null; state.picker=null; render(); break;
    case 'back': go('clients',{clientId:null}); break;
    case 'library': go('library'); break;
    case 'libCat': state.lib=state.lib||{}; state.lib.cat=el.dataset.v; render(); break;
    case 'libClear': state.lib={cat:(state.lib||{}).cat||''}; render(); break;
    case 'libEdit': state.libEdit=!state.libEdit; render(); break;
    case 'seedLib': store.seedLibrary(); break;
    case 'exNew': state.exEdit={name:'', cats:(state.lib&&state.lib.cat&&state.lib.cat!=='Unsorted')?[{cat:state.lib.cat, sub:(SUBS[state.lib.cat]||[])[0]||null}]:[], skill:1, equipment:['None'], muscles:[], plane:'', at_clubq:true, mode:'', videoUrl:'', notes:''}; render(); break;
    case 'exEdit': state.exEdit=JSON.parse(JSON.stringify(store.exercises[id])); render(); break;
    case 'exVariant': { const src=store.exercises[id]; if(!src) return; const v=JSON.parse(JSON.stringify(src)); delete v.id; v.variantOf=src.id; v.archived=false; v.videoUrl=''; v.name=src.name+' '; state.exEdit=v; render(); setTimeout(()=>{ const n=document.querySelector('input[data-f="ex"][data-k="name"]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },30); break; }
    case 'closeExEdit': if (el.classList.contains('picker') && e.target!==el) return; state.exEdit=null; render(); break;
    case 'exToggle': { const k=el.dataset.k, v=el.dataset.v; const arr=state.exEdit[k]=state.exEdit[k]||[]; const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); if(k==='equipment'){ if(v!=='None' && arr.includes('None') && arr.length>1) arr.splice(arr.indexOf('None'),1); if(!arr.length) arr.push('None'); } render(); break; }
    case 'exCat': { const c=el.dataset.cat, sub=el.dataset.sub||null; const arr=state.exEdit.cats=state.exEdit.cats||[]; const i=arr.findIndex(x=>x.cat===c && (x.sub||null)===sub); if(i>=0) arr.splice(i,1); else arr.push({cat:c, sub}); render(); break; }
    case 'exSave': { const x=state.exEdit; if(!(x.name||'').trim()){ toast('Give it a name'); return; } x.name=x.name.trim(); if(!x.id) x.id=uid('x'); x.archived=!!x.archived; state.exEdit=null; store.put('exercises', x); render(); toast('Saved'); break; }

    else if (el.dataset.i!=null){ const it=s.items[+el.dataset.i]; const k=+el.dataset.k; it.done=it.done||[]; const d=it.done[k]||{reps:it.reps,load:it.load,ok:false}; d[f] = f==='note' ? el.value : numOrNull(el.value); it.done[k]=d;
      if((f==='reps'||f==='load') && !isCardio(it) && !d.ok){ const r0=rxOf(it,k); const reps=d.reps ?? repsDefaultOf(r0); const load=d.load ?? r0.load; if(reps!=null && (load!=null || r0.load==null)){ d.ok=true; d.reps=reps; if(load!=null) d.load=load; if(d.rpe==null && r0.rpe) d.rpe=r0.rpe; if(d.rpe==null && it.rpe) d.rpe=it.rpe; const tb=document.querySelector(`.tick[data-i="${el.dataset.i}"][data-k="${k}"]`); if(tb) tb.setAttribute('aria-pressed','true'); refreshProgress(s); } } }
    clearTimeout(saveTimer); const sid=state.sessionId; saveTimer=setTimeout(()=>{ const live=store.sessions[sid]; if(live) store.put('sessions',live); },600);
  }
});
document.addEventListener('click', e => {
  const svg = e.target.closest && e.target.closest('svg[data-chart]'); if(!svg) return;
  const xs = svg.dataset.xs.split(',').map(Number); if(!xs.length) return;
  const r = svg.getBoundingClientRect(); const sc = Math.min(r.width/320, r.height/132); const ox = (r.width - 320*sc)/2; const vx = (e.clientX - r.left - ox)/sc;
  let best=0; xs.forEach((x,i)=>{ if(Math.abs(x-vx) < Math.abs(xs[best]-vx)) best=i; });
  state.chartSel = state.chartSel||{}; state.chartSel[svg.dataset.chart] = state.chartSel[svg.dataset.chart]===best ? null : best;
  renderKeepFocus();
});
/* pointer-based drag of a workout chip onto another day (works with mouse and touch) */
let drag=null, suppressClick=0;
function dragStart(chip, x, y){ drag={id:chip.dataset.id||chip.dataset.dragex, ex:!!chip.dataset.dragex, fromCat:chip.dataset.fromCat, fromSub:chip.dataset.fromSub||null, x, y, chip, active:false, over:null}; }
function dragMove(x, y, ev){ if(!drag) return; const dx=x-drag.x, dy=y-drag.y; if(!drag.active){ if(Math.hypot(dx,dy)<8) return; drag.active=true; drag.chip.classList.add('dragging'); drag.timer=setInterval(()=>{ if(!drag) return; const h=window.innerHeight; if(drag.ly>h-70) window.scrollBy(0,10); else if(drag.ly<70) window.scrollBy(0,-10); },16); } drag.ly=y; if(ev && ev.cancelable) ev.preventDefault(); drag.chip.style.transform=`translate(${dx}px,${dy}px)`; const sel = drag.ex ? '.subblock[data-cat]' : '.day[data-date]'; const day=[...document.querySelectorAll(sel)].find(d=>{ const r=d.getBoundingClientRect(); return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; }); if(day!==drag.over){ document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); if(day) day.classList.add('over'); drag.over=day; } }
document.addEventListener('pointerdown', e => { if(e.pointerType==='touch') return; const chip=e.target.closest && e.target.closest('.chip[data-drag], .exrow[data-dragex]'); if(!chip || e.button) return; const ctl=e.target.closest('input,select,button,a'); if(ctl && ctl!==chip && chip.contains(ctl)) return; dragStart(chip, e.clientX, e.clientY); try{ chip.setPointerCapture(e.pointerId); }catch(x){} });
document.addEventListener('touchstart', e => { let chip=e.target.closest && e.target.closest('.chip[data-drag], .exrow[data-dragex] .grip'); if(!chip || e.touches.length!==1) return; if(chip.classList.contains('grip')) chip=chip.closest('.exrow'); const t=e.touches[0]; dragStart(chip, t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchmove', e => { if(!drag) return; const t=e.touches[0]; dragMove(t.clientX, t.clientY, e); }, {passive:false});
document.addEventListener('touchend', e => { if(!drag) return; if(drag.active){ e.preventDefault(); } endDrag(e); }, {passive:false});
document.addEventListener('touchcancel', endDrag);
document.addEventListener('pointermove', e => { if(!drag || e.pointerType==='touch') return; dragMove(e.clientX, e.clientY, e); });
function endDrag(e){ if(!drag) return; const d=drag; drag=null; clearInterval(d.timer); d.chip.classList.remove('dragging'); d.chip.style.transform=''; document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); if(!d.active) return; suppressClick=Date.now(); if(d.ex){ const ex=store.exercises[d.id]; if(d.over && ex){ const tc=d.over.dataset.cat, ts=d.over.dataset.sub||null; if(tc!=='Unsorted' && !(tc===d.fromCat && ts===d.fromSub)){ ex.cats=(ex.cats||[]).filter(c=>!(c.cat===d.fromCat && (c.sub||null)===d.fromSub)); if(!ex.cats.some(c=>c.cat===tc && (c.sub||null)===ts)) ex.cats.push({cat:tc, sub:ts}); store.put('exercises', ex); toast(`${ex.name} → ${tc}${ts?' / '+ts:''}`); return; } } render(); return; } const s=store.sessions[d.id]; if(d.over && s && s.date!==d.over.dataset.date){ if(state.mode==='client'){ s.movedFrom=s.movedFrom||s.date; s.movedByClient=true; } s.date=d.over.dataset.date; store.put('sessions',s); toast('Moved to '+fmtDate(s.date)); } else render(); }
document.addEventListener('keydown', e => { if(e.key!=='Enter') return; const id=e.target.id; if(id==='loginEmail' || id==='loginPw'){ e.preventDefault(); if(state.loginMode==='link') store.sendLink($('#loginEmail').value); else store.signInPw($('#loginEmail').value, ($('#loginPw')||{}).value); } if(id==='pw1'||id==='pw2'){ e.preventDefault(); const b=document.querySelector('[data-act="pwSave"]'); if(b) b.click(); } });
let lastPointer=0; document.addEventListener('pointerdown', ()=>{ lastPointer=Date.now(); }, true);
document.addEventListener('focusin', e => { const el=e.target; if(el.tagName==='INPUT' && el.getAttribute('inputmode') && el.value!=='' && Date.now()-lastPointer<600){ const sel=()=>{ try{ el.select(); }catch(x){} }; sel(); setTimeout(sel,0); } });
document.addEventListener('pointerup', e => { if(e.pointerType==='touch') return; endDrag(e); }); document.addEventListener('pointercancel', e => { if(e.pointerType==='touch') return; endDrag(e); });
document.addEventListener('change', e => {
  const el=e.target;
  if(el.dataset.f==='exi' && el.tagName==='SELECT'){ const ex=store.exercises[el.dataset.id]; if(ex){ const k=el.dataset.k; ex[k]= k==='skill' ? +el.value : el.value; store.put('exercises', ex); } return; }
  if(el.dataset.f==='excat'){ const c=el.dataset.cat, sub=el.dataset.sub||null; const arr=state.exEdit.cats=state.exEdit.cats||[]; const i=arr.findIndex(x=>x.cat===c && (x.sub||null)===sub); if(el.checked && i<0) arr.push({cat:c, sub}); if(!el.checked && i>=0) arr.splice(i,1); const sum=el.closest('details').querySelector('summary span'); if(sum) sum.textContent=catSummary(arr); return; }
  if(el.dataset.f==='exchk'){ const arr=state.exEdit[el.dataset.k]=state.exEdit[el.dataset.k]||[]; const v=el.dataset.v; const i=arr.indexOf(v); if(el.checked && i<0) arr.push(v); if(!el.checked && i>=0) arr.splice(i,1); if(el.dataset.k==='equipment'){ if(v!=='None' && el.checked && arr.includes('None')) { arr.splice(arr.indexOf('None'),1); const nb=el.closest('.ddlist').querySelector('input[data-v="None"]'); if(nb) nb.checked=false; } if(!arr.length){ arr.push('None'); const nb=el.closest('.ddlist').querySelector('input[data-v="None"]'); if(nb) nb.checked=true; } } const sum=el.closest('details').querySelector('summary span'); if(sum) sum.textContent=ddSummary(arr);
      if(el.dataset.k==='muscles'){ const pm=document.getElementById('primaryMuscle'); if(pm) pm.innerHTML = arr.length ? arr.map((m,i)=>`<option value="${esc(m)}" ${i===0?'selected':''}>${esc(m)}</option>`).join('') : '<option value="">Pick muscles first</option>'; }
      return; }
  if(el.dataset.f==='exprimary' && state.exEdit){ const arr=state.exEdit.muscles||[]; const i=arr.indexOf(el.value); if(i>0){ arr.splice(i,1); arr.unshift(el.value); } const dd=el.closest('.field').querySelector('summary span'); if(dd) dd.textContent=ddSummary(arr); return; }
  if(el.dataset.f==='pickf' && state.picker){ state.picker.f=state.picker.f||{}; state.picker.f[el.dataset.k]=el.value; state.pickF=state.picker.f; const r=$('#pickResults'); if(r) r.innerHTML=pickerResults(); const hdr=el.closest('header'); if(hdr){ const clr=hdr.querySelector('[data-act="pickClear"]'); const any=Object.values(state.picker.f).some(Boolean); if(any && !clr){ el.closest('.filters').insertAdjacentHTML('beforeend','<button class="btn ghost sm" data-act="pickClear">Clear</button>'); } if(!any && clr) clr.remove(); } return; }
  if(el.dataset.f==='lib' && (el.tagName==='SELECT' || el.type==='checkbox')){ state.lib=state.lib||{}; state.lib[el.dataset.k]= el.type==='checkbox' ? el.checked : el.value; render(); return; }
  if(el.dataset.f==='ex' && el.tagName==='SELECT' && state.exEdit){ const k=el.dataset.k; state.exEdit[k] = k==='at_clubq' ? el.value==='yes' : k==='skill' ? +el.value : el.value; return; }
  if(el.dataset.f==='rpe' && el.tagName==='SELECT' && state.mode==='coach' && state.draft && el.dataset.k!=null){ const it=state.draft.items[+el.dataset.i]; ensureRx(it); it.setsRx[+el.dataset.k].rpe=rpeNorm(el.value); it.rpe=it.setsRx[0].rpe; return; }
  if(el.dataset.f==='loadUnit' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.loadUnit=el.value; render(); return; }
  if(el.dataset.f==='rest' && el.tagName==='SELECT' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.rest=el.value===''?null:+el.value; return; }
  if(el.dataset.f==='kpiMetric' && el.tagName==='SELECT'){ const c=store.clients[state.clientId]; if(!c) return; const arr=kpisOf(c).map(k=>Object.assign({},k)); arr[+el.dataset.i].metric=el.value; saveKpis(c,arr); return; }
  if(el.dataset.f==='warmup' && el.tagName==='SELECT' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.warmup=+el.value||0; return; }
  if(el.dataset.f==='unit' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.unit=el.value; render(); return; }
  if(el.dataset.cf==='mode'){ if(state.mode==='coach' && state.draft){ const it=state.draft.items[+el.dataset.i]; it.cardio=it.cardio||{}; it.cardio.mode=el.value; render(); } else if(state.mode==='client' && state.sessionId){ const s=store.sessions[state.sessionId]; const it=s.items[+el.dataset.i]; it.done=it.done||[]; const d=it.done[0]||{ok:false}; d.mode=el.value; it.done[0]=d; store.put('sessions',s); } return; }
  if(el.dataset.f==='rpe' && el.tagName==='SELECT' && state.mode==='client' && state.sessionId){ const s=store.sessions[state.sessionId]; const it=s.items[+el.dataset.i]; const k=+el.dataset.k; it.done=it.done||[]; const d=it.done[k]||{reps:repsDefault(it),load:it.load,ok:false}; d.rpe = rpeNorm(el.value); it.done[k]=d; store.put('sessions',s); return; }
  if(el.dataset.f==='clientStatus'){ const c=store.clients[state.clientId]; c.status=el.value; store.put('clients',c); toast(el.value==='active'?'Client active':el.value==='paused'?'Client paused':'Client archived'); }
});
function rerenderKeepFocus(el){ const id=el.id, pos=el.selectionStart; render(); const n = id ? document.getElementById(id) : document.querySelector('[data-f="'+el.dataset.f+'"]'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } }

let pendingRender=false;
function typing(){ const a=document.activeElement; return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA') && a.type!=='date'; }
store.onChange(()=>{ if (state.mode==='coach' && state.page==='edit') { const sy=$('#sync'); sy.className='sync '+(store.mode==='shared'?'on':'local'); return; } if (typing()) { pendingRender=true; return; } render(); });
document.addEventListener('focusout', ()=>{ if(pendingRender){ pendingRender=false; setTimeout(()=>{ if(!typing()) render(); else pendingRender=true; }, 60); } });
function renderKeepFocus(){ const a=document.activeElement; const isField = a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA') && a.dataset.f; const key = isField ? {f:a.dataset.f,i:a.dataset.i,k:a.dataset.k,pos:a.selectionStart,val:a.value} : null; render(); if(key){ const sel='[data-f="'+key.f+'"]'+(key.i!=null?'[data-i="'+key.i+'"]':'')+(key.k!=null?'[data-k="'+key.k+'"]':''); const n=document.querySelector(sel); if(n){ if(n.value!==key.val) n.value=key.val; n.focus(); try{n.setSelectionRange(key.pos,key.pos);}catch(x){} } } }
render();
store.init();
})();
